<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 150" width="112" height="100" role="img" aria-label="TAME, a small agent device with two orange lights">
  <style>
    .led { animation: wake 4.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes wake { 0%, 88%, 100% { transform: scaleY(1); } 92% { transform: scaleY(.15); } }
    @media (prefers-reduced-motion: reduce) { .led { animation: none; } }
  </style>
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3D42"/><stop offset="1" stop-color="#26292D"/></linearGradient>
  </defs>
  <ellipse cx="88" cy="142" rx="72" ry="7" fill="#000" opacity=".10"/>
  <rect x="12" y="10" width="152" height="126" rx="22" fill="#1B1D20"/>
  <rect x="4" y="2" width="152" height="126" rx="22" fill="url(#front)"/>
  <rect x="10" y="6" width="140" height="2" rx="1" fill="#FFF" opacity=".12"/>
  <rect x="24" y="22" width="112" height="60" rx="12" fill="#0E0F10"/>
  <rect class="led" x="56" y="38" width="14" height="28" rx="7" fill="#E8590C"/>
  <rect class="led" x="90" y="38" width="14" height="28" rx="7" fill="#E8590C"/>
  <circle cx="140" cy="112" r="4" fill="#E8590C"/>
  <text x="24" y="114" font-family="ui-monospace, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="1.5" fill="#8C9096">AGENT</text>
</svg>
