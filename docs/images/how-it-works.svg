<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1016 545" width="1016" height="545" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-label="How TAME works in four steps across three lanes. 1, upload examples: you upload files and TAME measures them. 2, draft a profile: you ask, your agent reads the examples and saves a draft that is not active. 3, approve in chat: your agent shows you the draft, you reply oke, and the agent publishes it as the active version. 4, write it: you ask for a document and your agent writes it with the active profile.">
  <defs>
    <marker id="dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3A3D42"/></marker>
    <marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#E8590C"/></marker>
    <style>
      .box { fill: #FFFFFF; stroke: #D2D2D7; }
      .tame { stroke: #E8590C; }
      .t { font-size: 13px; font-weight: 600; fill: #1D1D1F; }
      .d { font-size: 12px; fill: #6E6E73; }
      .lane { font-size: 14px; font-weight: 600; fill: #1D1D1F; }
      .step { font-size: 13px; font-weight: 600; fill: #1D1D1F; }
      .num { font-size: 12px; font-weight: 700; fill: #FFFFFF; }
      .pill { fill: #FFFFFF; }
      .pa { stroke: #E8590C; }
      .pd { stroke: #3A3D42; }
      .lab { font-size: 11px; text-anchor: middle; font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
      .la { fill: #B5440A; }
      .ld { fill: #3A3D42; }
      .acc { stroke: #E8590C; stroke-width: 2; fill: none; }
      .drk { stroke: #3A3D42; stroke-width: 2; fill: none; }
      .chat { stroke: #3A3D42; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
    </style>
  </defs>
  <rect width="1016" height="545" fill="#FFFFFF"/>

  <!-- Step headers, each centred over its column -->
  <circle cx="176.8" cy="30" r="11" fill="#E8590C"/><text class="num" x="176.8" y="34" text-anchor="middle">1</text>
  <text class="step" x="195.8" y="35">Upload examples</text>
  <circle cx="407.2" cy="30" r="11" fill="#E8590C"/><text class="num" x="407.2" y="34" text-anchor="middle">2</text>
  <text class="step" x="426.2" y="35">Draft a profile</text>
  <circle cx="621.5" cy="30" r="11" fill="#E8590C"/><text class="num" x="621.5" y="34" text-anchor="middle">3</text>
  <text class="step" x="640.5" y="35">Approve in chat</text>
  <circle cx="868.1" cy="30" r="11" fill="#E8590C"/><text class="num" x="868.1" y="34" text-anchor="middle">4</text>
  <text class="step" x="887.1" y="35">Write it</text>

  <!-- Lanes -->
  <rect x="20" y="60" width="976" height="110" rx="14" fill="#F5F5F7"/>
  <rect x="20" y="204" width="976" height="110" rx="14" fill="#F5F5F7"/>
  <rect x="20" y="348" width="976" height="110" rx="14" fill="#FBF3EC"/>
  <text class="lane" x="40" y="120">You</text>
  <text class="lane" x="40" y="255">Your</text>
  <text class="lane" x="40" y="273">agent</text>
  <text class="lane" x="40" y="408">TAME</text>

  <!-- Column 1 -->
  <rect class="box" x="150" y="77" width="170" height="76" rx="12"/>
  <text class="t" x="166" y="103">Upload files</text>
  <text class="d" x="166" y="123">finished documents</text>
  <text class="d" x="166" y="140">of one kind</text>

  <rect class="box tame" x="150" y="365" width="170" height="76" rx="12"/>
  <text class="t" x="166" y="391">Files measured</text>
  <text class="d" x="166" y="411">sections and style,</text>
  <text class="d" x="166" y="428">no model involved</text>

  <!-- Column 2 -->
  <rect class="box" x="370" y="77" width="170" height="76" rx="12"/>
  <text class="t" x="386" y="103">Ask for a profile</text>
  <text class="d" x="386" y="123">from one of your</text>
  <text class="d" x="386" y="140">collections</text>

  <rect class="box" x="370" y="221" width="170" height="76" rx="12"/>
  <text class="t" x="386" y="247">Read and draft</text>
  <text class="d" x="386" y="267">every rule cites</text>
  <text class="d" x="386" y="284">a quote from a file</text>

  <rect class="box tame" x="370" y="365" width="170" height="76" rx="12" stroke-dasharray="5 4"/>
  <text class="t" x="386" y="391">Draft saved</text>
  <text class="d" x="386" y="411">not active until</text>
  <text class="d" x="386" y="428">you approve it</text>

  <!-- Column 3 -->
  <rect class="box" x="590" y="77" width="170" height="76" rx="12"/>
  <text class="t" x="606" y="103">Review the draft</text>
  <text class="d" x="606" y="123">reply "oke", or ask</text>
  <text class="d" x="606" y="140">for changes</text>

  <rect class="box" x="590" y="221" width="170" height="76" rx="12"/>
  <text class="t" x="606" y="247">Publish</text>
  <text class="d" x="606" y="267">only after your</text>
  <text class="d" x="606" y="284">approval</text>

  <rect class="box tame" x="590" y="365" width="170" height="76" rx="12"/>
  <text class="t" x="606" y="391">Active version</text>
  <text class="d" x="606" y="411">never edited,</text>
  <text class="d" x="606" y="428">a new one each time</text>

  <!-- Column 4 -->
  <rect class="box" x="810" y="77" width="170" height="76" rx="12"/>
  <text class="t" x="826" y="103">Ask for a document</text>
  <text class="d" x="826" y="123">in one sentence, on</text>
  <text class="d" x="826" y="140">any connected device</text>

  <rect class="box" x="810" y="221" width="170" height="76" rx="12"/>
  <text class="t" x="826" y="247">Write the document</text>
  <text class="d" x="826" y="267">in your structure</text>
  <text class="d" x="826" y="284">and look</text>

  <!-- Arrows -->
  <path class="drk" d="M235 153 V 362" marker-end="url(#dark)"/>
  <path class="acc" d="M320 403 H 340 V 259 H 367" marker-end="url(#acc)"/>
  <path class="chat" d="M455 153 V 218" marker-end="url(#dark)"/>
  <path class="acc" d="M455 297 V 362" marker-end="url(#acc)"/>
  <path class="chat" d="M540 259 H 565 V 115 H 587" marker-end="url(#dark)"/>
  <path class="chat" d="M675 153 V 218" marker-end="url(#dark)"/>
  <path class="acc" d="M675 297 V 362" marker-end="url(#acc)"/>
  <path class="chat" d="M895 153 V 218" marker-end="url(#dark)"/>
  <path class="acc" d="M760 403 H 895 V 300" marker-end="url(#acc)"/>

  <!-- Arrow labels, centred in the gaps between lanes -->
  <rect class="pill pd" x="201" y="316" width="68" height="20" rx="10"/><text class="lab ld" x="235" y="330">web app</text>
  <rect class="pill pa" x="289" y="316" width="102" height="20" rx="10"/><text class="lab la" x="340" y="330">read_example</text>
  <rect class="pill pa" x="401" y="316" width="108" height="20" rx="10"/><text class="lab la" x="455" y="330">draft_profile</text>
  <rect class="pill pd" x="504" y="172" width="122" height="20" rx="10"/><text class="lab ld" x="565" y="186">shows the draft</text>
  <rect class="pill pd" x="648" y="172" width="54" height="20" rx="10"/><text class="lab ld" x="675" y="186">"oke"</text>
  <rect class="pill pa" x="614" y="316" width="122" height="20" rx="10"/><text class="lab la" x="675" y="330">publish_profile</text>
  <rect class="pill pa" x="848" y="364" width="95" height="20" rx="10"/><text class="lab la" x="895" y="378">use_profile</text>

  <!-- Legend -->
  <path class="acc" d="M150 490 H 186"/>
  <text class="d" x="196" y="494">MCP tool your agent calls</text>
  <path class="chat" d="M380 490 H 416"/>
  <text class="d" x="426" y="494">chat with your agent</text>
  <path class="drk" d="M590 490 H 626"/>
  <text class="d" x="636" y="494">web app in your browser</text>
  <text class="d" x="150" y="524">Connect each device once before step 2: add the server to your agent, then sign in with Google and allow it.</text>
</svg>
