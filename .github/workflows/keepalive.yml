name: Keep alive

# Supabase pauses free projects that stay idle, so a light database query runs every three days
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "https://tame-119708107948.asia-southeast1.run.app/api/health"
