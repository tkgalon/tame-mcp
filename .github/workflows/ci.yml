name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_only
          TAME_SITE_URL: http://localhost:3000

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:start
        env:
          # Google sign-in is not exercised in CI, but the config needs values
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-unused
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-unused
      - name: Write local app settings
        run: |
          status=$(pnpm exec supabase status -o json)
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$status" | jq -r .API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(echo "$status" | jq -r .PUBLISHABLE_KEY)"
            echo "TAME_SITE_URL=http://localhost:3000"
            echo "TAME_SUPABASE_SECRET_KEY=$(echo "$status" | jq -r .SECRET_KEY)"
            echo "TAME_DATABASE_URL=$(echo "$status" | jq -r .DB_URL)"
          } > apps/web/.env.local
      - run: pnpm test:integration
